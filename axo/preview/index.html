<title>Axolotl Rig Preview</title>
<style>

// iris colours (the game's eye colours)
{ const l = document.createElement('label'); l.textContent = 'iris'; row('iris').appendChild(l); const ib = {};

mk(row('eyes'), 'fangs', b => { look.setFangs(!look.fangs); b.classList.toggle('on', look.fangs); }, 'sm');

slider(row('motion'), 'crawl speed', 0, 1.5, 1, 0.05, v => A.motion.speed = v);
let turnHold = 0; const tb = (label, d) => { const b = mk(row('motion'), label, () => {}, 'sm'); const on = () => { A.motion.turn = d; b.classList.add('on'); }, off = () => { A.motion.turn = 0; b.classList.remove('on'); }; b.onpointerdown = on; b.onpointerup = off; b.onpointerleave = off; return b; };
