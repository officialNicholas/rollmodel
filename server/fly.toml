# Fly.io settings for the game server. Deploy from this folder: fly deploy --ha=false
# One machine on purpose: the lobby, queues, rooms and matches live in one process's memory.
app = "rollmodel-game"
primary_region = "ord"

[env]
  PORT = "8080"
  TRUST_PROXY = "1"
  DATA_FILE = "/data/store.json"
  LOG_LEVEL = "info"
  # the game doesn't show online pick-ups yet: none are handed out
  RULES = '{"items":false}'
  # matches on worker threads, one per core but the main thread's (sockets and lobby): on performance-2x, one worker.
  # Measured: 1,000 players in duels, main thread 65% of a core, the match worker 49% (docs/net-scale.md)
  MATCH_WORKERS = "auto"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    soft_limit = 2000
    hard_limit = 4000

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  path = "/health"
  timeout = "3s"

[mounts]
  source = "rm_data"
  destination = "/data"

# two dedicated cores and 4 GB: room for 1,000 players at once (about 1.3 cores and 560 MB measured). A shared CPU is
# held to about 1/16 of a core once its burst balance is spent, which would stall every match's tick.
[[vm]]
  size = "performance-2x"
  memory = "4gb"
