# Fly.io settings for the game server: ONE machine, two dedicated cores and 4 GB, about 1,000 players at once (room for
# 1,500). Deploy from this folder: fly deploy --ha=false
# One machine on purpose: parties, invites, queues and rooms live in one process's memory. Matches run on a worker thread
# beside it. The same app, volume and /data/store.json as before. fly.scale.toml is the several-machine setup for
# 5,000 players (docs/net-scale.md); parties would need to be shared between machines first.
app = "rollmodel-game"
primary_region = "ord"

[env]
  PORT = "8080"
  TRUST_PROXY = "1"
  DATA_FILE = "/data/store.json"
  LOG_LEVEL = "info"
  # (v427) pick-ups, the orb and the specials are on: a match gets them when every game in it is v427 or later
  # (older games say nothing of them, and the match plays without, as before)
  # matches on a worker thread, the main thread keeps the sockets and the lobby (on performance-2x: one worker).
  # Measured: 1,000 players in duels, main thread 65% of a core, the match worker 49% (docs/net-scale.md)
  MATCH_WORKERS = "auto"
  # one machine: no handing connections to another
  FLY_REPLAY = "0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    soft_limit = 1000
    hard_limit = 1500

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  path = "/health"
  timeout = "3s"

[mounts]
  source = "rm_data"
  destination = "/data"

# a shared CPU is held to about 1/16 of a core once its burst balance is spent, which stalls every match's tick
[[vm]]
  size = "performance-2x"
  memory = "4gb"
