# Fly.io settings for the game server. Deploy from this folder: fly deploy --ha=false
# One machine on purpose: the lobby, queues, rooms and matches live in one process's memory.
app = "rollmodel-game"
primary_region = "ord"

[env]
  PORT = "8080"
  TRUST_PROXY = "1"
  DATA_FILE = "/data/store.json"
  LOG_LEVEL = "info"
  # the game doesn't show online pick-ups yet: none are handed out
  RULES = '{"items":false}'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    soft_limit = 2000
    hard_limit = 4000

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  path = "/health"
  timeout = "3s"

[mounts]
  source = "rm_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
