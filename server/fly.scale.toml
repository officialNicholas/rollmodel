# Fly.io settings for LATER: several machines as one server, 5,000 players at once. Not in use: fly.toml (one machine)
# is. Before this one, parties and invites must be shared between machines (today they live in one machine's memory).
# Deploy from this folder: fly deploy -c fly.scale.toml (docs/net-scale.md has the first-time steps).
#
# Several machines (for 5,000 players at once):
#   game   the game servers: the public WebSocket, the lobby and the matches, about 1,000 players each (room for 1,500).
#          No volume: nothing on them needs keeping. Fly sends each new player to one with room, and hands a connection
#          meant for a particular one (a room there, a match to pick up) straight to it (fly-replay).
#   store  one machine that keeps the players (the data file on the volume) and serves them to the game machines on the
#          private network (port 8081, never public, and only with INTERNAL_KEY, a Fly secret).
# Machine counts: fly scale count game=6 store=1 (6 game machines: 5,000 players at about 830 each, with room for one
# to be down).
app = "rollmodel-game"
primary_region = "ord"

[processes]
  game = "node src/index.js"
  store = "node src/index.js"

[env]
  PORT = "8080"
  TRUST_PROXY = "1"
  DATA_FILE = "/data/store.json"
  LOG_LEVEL = "info"
  # the game doesn't show online pick-ups yet: none are handed out
  RULES = '{"items":false}'
  # matches on worker threads, one per core but the main thread's (sockets and lobby): on performance-2x, one worker.
  # Measured: 1,000 players in duels, main thread 65% of a core, the match worker 49% (docs/net-scale.md)
  MATCH_WORKERS = "auto"
  # where the game machines find the store machine (the store machine itself ignores it and serves the file)
  STORE_URL = "http://store.process.rollmodel-game.internal:8081"

[http_service]
  internal_port = 8080
  processes = ["game"]
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  # new players go to a machine under soft_limit; a machine never takes more than hard_limit
  [http_service.concurrency]
    type = "connections"
    soft_limit = 1000
    hard_limit = 1500

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  path = "/health"
  timeout = "3s"

# the store machine's private API is reachable only on the private network (no public service); this checks it's up
[checks.store_api]
  type = "tcp"
  port = 8081
  processes = ["store"]
  grace_period = "10s"
  interval = "15s"
  timeout = "3s"

[mounts]
  source = "rm_data"
  destination = "/data"
  processes = ["store"]

# game: two dedicated cores and 4 GB, room for 1,500 players (1,000 measured at about 1.3 cores and 560 MB). A shared CPU
# is held to about 1/16 of a core once its burst balance is spent, which would stall every match's tick.
[[vm]]
  size = "performance-2x"
  memory = "4gb"
  processes = ["game"]

# store: about 100 requests a second at 5,000 players (it serves about 1,200 a second)
[[vm]]
  size = "performance-1x"
  memory = "2gb"
  processes = ["store"]
